# Sharing destinations. One [[misp]] block per MISP instance.
# `misp` is the only supported integration; any other table name is skipped
# with an unknown_integration warning.
#
# SECRETS: api_key must be a ${ENV_VAR} reference. A literal value is redacted
# and raises an api_key_literal warning. Keep the secret in ~/.env (mode 600,
# outside every git repo) and let the shell export it.
#
# Check this file with:
#   opentide validate --check sharing-config --strict
#   opentide share targets
#   opentide share preview          # resolves locally, makes no request
#   opentide share status           # compares the local ledger, no request

[[misp]]
# Lowercase, digits, hyphen or underscore, max 64 chars.
name = "hacklu-misp"

# A disabled block is invisible to preview, status, push and retract: all four
# exit "No sharing target matched the request". Left true so preview works;
# nothing can leave the machine while url is a placeholder and MISP_API_KEY is
# unset.
enabled = true

# REPLACE with the real instance before anything is pushed.
url = "https://mylab.miresec.fr:8443"

# Resolved from the environment at run time, never stored here.
api_key = "${MISP_API_KEY}"

# TLP ceiling. Objects above it are skipped with reason max_tlp.
# Order: clear < green < amber < amber+strict < red.
# Every current object is tlp: clear, so any ceiling passes them.
max_tlp = "green"

# Object families to publish. Default is all three. Signals are not separate
# events; they travel inside their objective.
object_types = ["threat", "objective", "rule"]

# Rule status gate, and the default. The PHP2Shell rule is STAGING, so it is
# reported as skipped_status / rule_status until it is promoted. Add "STAGING"
# here only if sharing work-in-progress rules is intended.
rule_statuses = ["PRODUCTION"]

# Override of metadata.organisation.uuid on EVERY object in this block. It must
# match the organisation owning the API key, which on this instance is
# MIRESEC (305d4e1e-80d2-4592-a1d7-b9cec29bb626). Without it, objects carrying
# 7623cc98… Example Corp or 56b0a0f0… EC DIGIT CSOC fail with
# organisation_uuid_mismatch.
#
# CAVEAT: this stamps MIRESEC onto every object regardless of the organisation
# recorded in the object itself. Acceptable on a lab instance where MIRESEC owns
# the key; on a real instance, create the matching organisations there instead,
# or use one block per organisation.
organisation_uuid = "305d4e1e-80d2-4592-a1d7-b9cec29bb626"

# Create events unpublished. Flip to true, or pass --publish, once reviewed.
publish = false

verify_ssl = true
